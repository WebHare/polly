services:
  polly:
    image: ${POLLY_IMAGE:-polly-web:local}
    build:
      context: .
      args:
        REVISION: ${POLLY_REVISION:-unknown}
    user: "${POLLY_UID:-10001}:${POLLY_GID:-10001}"
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      POLLY_CONFIG: /run/secrets/polly.yaml
      POLLY_VIEWER_USERNAME: ${POLLY_VIEWER_USERNAME:?Set POLLY_VIEWER_USERNAME}
      POLLY_VIEWER_PASSWORD_HASH_FILE: /run/secrets/viewer.hash
    ports:
      - "127.0.0.1:${POLLY_PORT:-8088}:8088"
    volumes:
      - type: bind
        source: ${POLLY_CONFIG:?Set POLLY_CONFIG to an absolute private file path}
        target: /run/secrets/polly.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${POLLY_VIEWER_PASSWORD_HASH_FILE:?Set POLLY_VIEWER_PASSWORD_HASH_FILE}
        target: /run/secrets/viewer.hash
        read_only: true
        bind:
          create_host_path: false
