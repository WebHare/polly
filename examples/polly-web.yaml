# Copy this to a private file outside the repository and set POLLY_CONFIG to its absolute path.
# The service reads this once and never writes it. Restart after editing.
passwordStorage: file
sources:
  - name: My Nagios
    type: nagios
    url: https://nagios.example.com
    username: replace-with-nagios-user
    password: replace-with-nagios-password
    enabled: true
