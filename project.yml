# XcodeGen spec. Regenerate the Xcode project with:  xcodegen generate
name: Polly
options:
  bundleIdPrefix: nl.webhare
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  PollyKit:
    path: Packages/PollyKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Polly:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CHANGELOG.md
        buildPhase: resources
      - path: App/Shared
      - path: App/macOS
        destinationFilters: [macOS]
      - path: App/iOS
        destinationFilters: [iOS]
    dependencies:
      - package: PollyKit
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 WebHare b.v. GNU GPL version 2.
        # Nagios servers are often internal and plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.webhare.polly
        PRODUCT_NAME: Polly
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Polly
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        # macOS: menu bar only, no Dock icon.
        "INFOPLIST_KEY_LSUIElement[sdk=macosx*]": YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/macOS/Polly.entitlements
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        # The multiplatform default points inside MacOS/Frameworks, not Contents/Frameworks.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        CODE_SIGN_STYLE: Automatic
        # WebHare bv. A stable team signature keeps keychain access working across rebuilds.
        DEVELOPMENT_TEAM: MF6WPNPK5H
      configs:
        Debug:
          "PRODUCT_NAME[sdk=macosx*]": Polly DEV
          "INFOPLIST_KEY_CFBundleDisplayName[sdk=macosx*]": Polly DEV
          "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]": AppIconDev

schemes:
  Polly:
    build:
      targets:
        Polly: all
    test:
      targets:
        - package: PollyKit/PollyKitTests
