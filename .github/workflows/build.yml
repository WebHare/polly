name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed update from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.publish && 'release' || github.ref }}
  cancel-in-progress: ${{ !inputs.publish }}

jobs:
  macos:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      # Developer ID signing and notarization only happen when these secrets are configured
      # (see README.md, "Continuous integration"). Without them the app is ad-hoc signed.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_API_KEY != '' }}
      TEAM_ID: MF6WPNPK5H
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate release request
        if: env.PUBLISH == 'true'
        env:
          HAS_UPDATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$HAS_SIGNING" = true
          test "$HAS_UPDATE_KEY" = true

      - name: Test release notes
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test PollyKit
        run: swift test --package-path Packages/PollyKit

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build Polly.app
        run: |
          if [ "$HAS_SIGNING" = true ]; then
            SIGNING=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Developer ID Application"
                     DEVELOPMENT_TEAM="$TEAM_ID" OTHER_CODE_SIGN_FLAGS=--timestamp)
          else
            SIGNING=(CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          fi
          xcodebuild -project Polly.xcodeproj -scheme Polly -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            "${SIGNING[@]}" build
          mkdir -p dist
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release/Polly.app" dist/
          # Plain xcodebuild does not re-sign Sparkle's nested helpers for notarization.
          if [ "$HAS_SIGNING" = true ]; then
            FRAMEWORK=dist/Polly.app/Contents/Frameworks/Sparkle.framework/Versions/B
            for HELPER in XPCServices/Installer.xpc XPCServices/Downloader.xpc Autoupdate Updater.app; do
              codesign --force --sign "Developer ID Application" --options runtime --timestamp \
                --preserve-metadata=entitlements "$FRAMEWORK/$HELPER"
            done
            codesign --force --sign "Developer ID Application" --options runtime --timestamp "$FRAMEWORK"
            codesign --force --sign "Developer ID Application" --options runtime --timestamp \
              --preserve-metadata=entitlements dist/Polly.app
          fi
          codesign --verify --deep --strict --verbose=2 dist/Polly.app
          # A multiplatform build can compile yet fail at launch with the iOS framework search path.
          otool -l dist/Polly.app/Contents/MacOS/Polly > "$RUNNER_TEMP/load-commands.txt"
          grep -Fq '@executable_path/../Frameworks' "$RUNNER_TEMP/load-commands.txt"

      - name: Prepare release notes and check version
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Polly.app/Contents/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/Polly.app/Contents/Info.plist)
          python3 scripts/release_notes.py "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release list --json tagName > "$RUNNER_TEMP/releases.json"
          python3 - "$VERSION" "$RUNNER_TEMP/releases.json" <<'PYCODE'
          import json, sys
          assert all(r["tagName"] != "v" + sys.argv[1] for r in json.load(open(sys.argv[2]))), "Version already published"
          PYCODE
          STATUS=$(curl --silent --show-error --location --output "$RUNNER_TEMP/previous-appcast.xml" \
            --write-out '%{http_code}' "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml")
          if [ "$STATUS" = 200 ]; then
            python3 - "$BUILD" "$RUNNER_TEMP/previous-appcast.xml" <<'PYCODE'
          import sys, xml.etree.ElementTree as ET
          versions = ET.parse(sys.argv[2]).findall(".//{http://www.andymatuschak.org/xml-namespaces/sparkle}version")
          assert versions, "Published appcast has no build number"
          assert int(sys.argv[1]) > max(int(v.text) for v in versions), "Increase CURRENT_PROJECT_VERSION"
          PYCODE
          elif [ "$STATUS" != 404 ]; then
            echo "❌ Could not read published appcast (HTTP $STATUS)"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create the DMG
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Polly.app/Contents/Info.plist)
          DMG="Polly-$VERSION-${{ github.run_number }}.dmg"
          ln -s /Applications dist/Applications
          hdiutil create -volname Polly -srcfolder dist -fs HFS+ -format UDZO -ov "$DMG"
          if [ "$HAS_SIGNING" = true ]; then
            codesign --sign "Developer ID Application" --timestamp "$DMG"
          fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize the DMG
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          echo "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$DMG" --wait \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID"
          xcrun stapler staple "$DMG"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Sign and publish the update
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir feed
          cp "$DMG" feed/
          cp "$RUNNER_TEMP/release-notes.md" "feed/${DMG%.dmg}.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$RUNNER_TEMP/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast" \
            --ed-key-file - --embed-release-notes \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" feed
          python3 - feed/appcast.xml <<'PYCODE'
          import sys, xml.etree.ElementTree as ET
          enclosure = ET.parse(sys.argv[1]).find("./channel/item/enclosure")
          assert enclosure is not None and enclosure.get("{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature"), "Missing update signature"
          PYCODE
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Polly $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "feed/$DMG" feed/appcast.xml

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
