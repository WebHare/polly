name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The container test checks the dashboard in Chromium (scripts/test-container-browser.mjs).
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The Swift image version is part of the cache key: build products of another compiler can't be reused.
      - name: Read the Swift image version
        id: swift
        run: echo "image=$(sed -n 's/^SWIFT_IMAGE = \"swift:\(.*\)\"$/\1/p' scripts/test-linux.py)" >> "$GITHUB_OUTPUT"

      # Compiling Vapor and its dependencies takes minutes; keep the debug builds of the Linux test containers.
      - uses: actions/cache@v6
        with:
          path: |
            .build/linux
            .build/linux-web
          key: swift-linux-${{ runner.arch }}-${{ steps.swift.outputs.image }}-${{ hashFiles('Packages/*/Package.resolved') }}
          restore-keys: swift-linux-${{ runner.arch }}-${{ steps.swift.outputs.image }}-

      - name: Test PollyKit and PollyWeb with real HTTP on Linux
        run: python3 scripts/test-linux.py

      # The default Docker builder can't export a layer cache; a docker-container builder can.
      - uses: docker/setup-buildx-action@v4
      # Exposes the Actions cache token and URL that the type=gha cache backend needs to run steps.
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and test the distributable image through Compose
        env:
          # mode=max also caches the build stage, whose dependency layer saves most of the release build.
          # --load makes the image available to Compose, as the docker-container builder keeps it otherwise.
          POLLY_TEST_BUILD_FLAGS: >-
            --load
            --cache-from type=gha,scope=container-${{ runner.arch }}
            --cache-to type=gha,mode=max,scope=container-${{ runner.arch }}
        run: python3 scripts/test-container.py

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/generate-web-design.py --check
      - run: npm test
      - run: npm run test:browser

  # Runs in parallel with linux and web; the build job below gates merging on all three.
  macos:
    runs-on: macos-26
    env:
      # Developer ID signing and notarization only happen when these secrets are configured
      # (see README.md, "Continuous integration"). Without them the app is ad-hoc signed.
      # The secrets and variables are maintained by WebHare's portal (webhare_portal, data/github-projects.yaml).
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_API_KEY != '' }}
      TEAM_ID: MF6WPNPK5H
    steps:
      - uses: actions/checkout@v7

      - name: Test release notes
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test PollyKit
        run: swift test --package-path Packages/PollyKit

      - name: Test PollyWeb
        run: swift test --package-path Packages/PollyWeb

      - name: Test real HTTP and upstream recovery on macOS
        run: |
          python3 scripts/test-web.py
          python3 scripts/test-web-upstream-faults.py

      - name: Build Polly for iOS Simulator
        run: |
          xcodebuild -project Polly.xcodeproj -scheme Polly -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build Polly.app
        run: |
          if [ "$HAS_SIGNING" = true ]; then
            SIGNING=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Developer ID Application"
                     DEVELOPMENT_TEAM="$TEAM_ID" OTHER_CODE_SIGN_FLAGS=--timestamp)
          else
            SIGNING=(CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          fi
          xcodebuild -project Polly.xcodeproj -scheme Polly -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            "${SIGNING[@]}" build
          mkdir -p dist
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release/Polly.app" dist/
          codesign --verify --deep --strict --verbose=2 dist/Polly.app
          # A multiplatform build can compile yet fail at launch with the iOS framework search path.
          otool -l dist/Polly.app/Contents/MacOS/Polly > "$RUNNER_TEMP/load-commands.txt"
          grep -Fq '@executable_path/../Frameworks' "$RUNNER_TEMP/load-commands.txt"

      - name: Create the DMG
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Polly.app/Contents/Info.plist)
          DMG="Polly-$VERSION-${{ github.run_number }}.dmg"
          ln -s /Applications dist/Applications
          hdiutil create -volname Polly -srcfolder dist -fs HFS+ -format UDZO -ov "$DMG"
          if [ "$HAS_SIGNING" = true ]; then
            codesign --sign "Developer ID Application" --timestamp "$DMG"
          fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize the DMG
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ vars.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ vars.NOTARY_API_ISSUER_ID }}
        run: |
          echo "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$DMG" --wait \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID"
          xcrun stapler staple "$DMG"
          rm "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # The required check for merging. A skipped or cancelled job can permit merging, so this job always runs
  # and fails unless every job above succeeded.
  build:
    needs: [linux, web, macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require passing Linux, browser and macOS jobs
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WEB_RESULT: ${{ needs.web.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: test "$LINUX_RESULT" = success && test "$WEB_RESULT" = success && test "$MACOS_RESULT" = success
