name: TestFlight

# Builds the selected ref and uploads it to TestFlight. Started by hand only: Actions → TestFlight → Run workflow,
# or `gh workflow run testflight.yml -f platform=both`. See "TestFlight" in DEVELOPERS.md.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which builds to upload
        type: choice
        options: [both, ios, macos]
        default: both
      groups:
        description: Comma-separated TestFlight groups (empty = only groups with automatic distribution)
        type: string
        default: ""
      external:
        description: Also distribute to the external testers in those groups (submits for beta review)
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel an upload halfway; a second run waits for the first.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["ios","macos"]' || format('["{0}"]', inputs.platform)) }}
    env:
      # The secrets and variables are maintained by WebHare's portal (webhare_portal, data/github-projects.yaml).
      ASC_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.APPSTORE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('.ruby-version', 'Gemfile.lock') }}

      # Fixed certificates and profiles instead of automatic signing, which would create a new development
      # certificate in the team account on every run.
      - name: Install the certificates, profile and API key
        env:
          CERTIFICATE_P12: ${{ secrets.APPSTORE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          PROFILE: ${{ matrix.platform == 'ios' && secrets.APPSTORE_PROFILE_IOS || secrets.APPSTORE_PROFILE_MACOS }}
        run: |
          for name in CERTIFICATE_P12 CERTIFICATE_PASSWORD API_KEY PROFILE ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured"; exit 1; fi
          done

          KEYCHAIN="$RUNNER_TEMP/appstore.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/appstore.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/appstore.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/appstore.p12"

          # Xcode 16 and later read profiles from UserData; older tools from MobileDevice.
          if [ "${{ matrix.platform }}" = ios ]; then EXT=mobileprovision; else EXT=provisionprofile; fi
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.$EXT"
          security cms -D -i "$RUNNER_TEMP/profile.$EXT" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.$EXT" "$dir/$UUID.$EXT"
          done
          echo "POLLY_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Profile: $NAME, expires $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")"

          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/asc-api-key.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc-api-key.p8" >> "$GITHUB_ENV"

      # App Store Connect refuses builds made with an older SDK (ITMS-90725).
      - name: Check the Xcode version
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ "$MAJOR" -lt 27 ]; then echo "::error::Xcode $MAJOR is too old; uploads need Xcode 27 or later"; exit 1; fi

      - name: Upload to TestFlight
        env:
          TESTER_GROUPS: ${{ inputs.groups }}
          EXTERNAL: ${{ inputs.external }}
        run: |
          ARGS=(--build-number auto --groups "$TESTER_GROUPS")
          if [ "$EXTERNAL" = true ]; then ARGS+=(--external); fi
          scripts/testflight-${{ matrix.platform }}.sh "${ARGS[@]}"

      # Only the build log: the uploaded app itself is in TestFlight.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testflight-${{ matrix.platform }}-log
          path: ~/Library/Logs/gym/
          if-no-files-found: ignore

      - name: Remove the keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/appstore.keychain-db" || true
          rm -f "$RUNNER_TEMP/asc-api-key.p8"
