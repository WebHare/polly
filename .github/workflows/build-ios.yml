name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Checks that the iPhone/iPad app compiles for devices. It is not signed: installing it on a device
      # needs a provisioning profile, and distributing it needs TestFlight or the App Store.
      - name: Build Polly for iOS
        run: |
          xcodebuild -project Polly.xcodeproj -scheme Polly -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
