<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex; width:{{s}}px; height:{{s}}px; flex:none;">
<sc-if value="{{isOk}}" hint-placeholder-val="{{true}}">
<svg viewBox="0 0 20 20" width="100%" height="100%" style="display:block"><circle cx="10" cy="10" r="8.6" fill="{{fill}}"></circle><path d="M6.1 10.3 L8.7 12.9 L13.9 7.4" fill="none" stroke="{{glyph}}" style="stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round"></path></svg>
</sc-if>
<sc-if value="{{isWarn}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 20 20" width="100%" height="100%" style="display:block"><path d="M10 2.6 L18 16.6 H2 Z" fill="{{fill}}" stroke="{{fill}}" style="stroke-width:2.4;stroke-linejoin:round"></path><path d="M10 7.6 V11.4" stroke="#14213D" style="stroke-width:2.2;stroke-linecap:round"></path><circle cx="10" cy="14.2" r="1.25" fill="#14213D"></circle></svg>
</sc-if>
<sc-if value="{{isCrit}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 20 20" width="100%" height="100%" style="display:block"><path d="M6.6 1.6 H13.4 L18.4 6.6 V13.4 L13.4 18.4 H6.6 L1.6 13.4 V6.6 Z" fill="{{fill}}" stroke="{{fill}}" style="stroke-width:1;stroke-linejoin:round"></path><path d="M7.2 7.2 L12.8 12.8 M12.8 7.2 L7.2 12.8" stroke="{{glyph}}" style="stroke-width:2.2;stroke-linecap:round"></path></svg>
</sc-if>
<sc-if value="{{isUnk}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 20 20" width="100%" height="100%" style="display:block"><rect x="1.8" y="1.8" width="16.4" height="16.4" rx="4.5" fill="{{fill}}"></rect><path d="M7.6 7.8 Q7.6 5.4 10 5.4 Q12.4 5.4 12.4 7.6 Q12.4 9.2 10.6 9.9 Q10 10.2 10 11.4" fill="none" stroke="{{glyph}}" style="stroke-width:2;stroke-linecap:round"></path><circle cx="10" cy="14.3" r="1.2" fill="{{glyph}}"></circle></svg>
</sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:60,&quot;height&quot;:60},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;warning&quot;,&quot;critical&quot;,&quot;unknown&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:16,&quot;tsType&quot;:&quot;number&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const st = this.props.status ?? 'ok';
    const dark = this.props.dark === true || this.props.dark === 'true';
    const L = { ok: ['#1E9E63', '#FFFFFF'], warning: ['#F2B21B', '#14213D'], critical: ['#DC3B42', '#FFFFFF'], unknown: ['#7C6CF0', '#FFFFFF'] };
    const D = { ok: ['#3DD68C', '#0B2418'], warning: ['#FFC53D', '#14213D'], critical: ['#FF5C63', '#FFFFFF'], unknown: ['#A99BFF', '#1A1640'] };
    const [fill, glyph] = (dark ? D : L)[st] || L.ok;
    return { s: Number(this.props.size ?? 16), fill, glyph, isOk: st === 'ok', isWarn: st === 'warning', isCrit: st === 'critical', isUnk: st === 'unknown' };
  }
}
</script>
</body>
</html>
