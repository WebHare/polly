<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;warning&quot;,&quot;critical&quot;,&quot;unreachable&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;'ok'|'warning'|'critical'|'unreachable'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:160,&quot;min&quot;:16,&quot;max&quot;:512,&quot;tsType&quot;:&quot;number&quot;},&quot;tile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood ?? 'ok';
    const s = Number(this.props.size ?? 160);
    const tile = this.props.tile === true || this.props.tile === 'true';
    const tiles = {
      ok: 'linear-gradient(180deg,#22365F 0%,#14213D 100%)',
      warning: 'linear-gradient(180deg,#6B4A12 0%,#3A2608 100%)',
      critical: 'linear-gradient(180deg,#6E1D33 0%,#38101C 100%)',
      unreachable: 'linear-gradient(180deg,#3B4160 0%,#20243A 100%)'
    };
    return {
      s,
      isOk: mood === 'ok', isWarn: mood === 'warning', isCrit: mood === 'critical', isUnr: mood === 'unreachable',
      bg: tile ? tiles[mood] : 'transparent',
      radius: tile ? Math.round(s * 0.225) + 'px' : '0',
      vb: tile ? '-24 -18 248 248' : '0 0 200 200',
      shadow: tile ? 'inset 0 1px 0 rgba(255,255,255,.10), 0 1px 2px rgba(20,33,61,.18)' : 'none'
    };
  }
}
</script>
